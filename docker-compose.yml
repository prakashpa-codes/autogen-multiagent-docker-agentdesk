services:
  backend:
    build: ./backend
    # The API key and limits come from .env at run time, never baked into the image.
    env_file: .env
    restart: unless-stopped
    # No "ports": the backend is reachable only from other containers on this network.

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      # Trust X-Forwarded-For from nginx so Streamlit sees the visitor's real IP.
      # Safe only because the frontend has no public port. Only nginx can reach it.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      # Our config replaces the image's default site config. ":ro" = read-only.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped