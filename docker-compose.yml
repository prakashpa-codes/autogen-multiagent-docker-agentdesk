services:
  backend:
    build: ./backend
    # The API key and limits come from .env at run time, never baked into the image.
    env_file: .env
    restart: unless-stopped
    # No "ports": the backend is reachable only from other containers on this network.

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      # Trust X-Forwarded-For from Traefik so Streamlit sees the visitor's real IP.
      # Safe only because the frontend's port is bound to 127.0.0.1, so visitors cannot reach it directly.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      # Local testing: open http://localhost:8502. 127.0.0.1 keeps it off the public internet.
      # 8502, not 8501, because another app on the VPS already uses 8501.
      - "127.0.0.1:8502:8501"
    labels:
      # Traefik on the VPS reads these labels and routes the domain to this container.
      # On a laptop without Traefik they are ignored.
      - traefik.enable=true
      - traefik.http.routers.agentdesk.rule=Host(`autogendemo.labspace.tech`)
      - traefik.http.routers.agentdesk.entrypoints=websecure
      - traefik.http.routers.agentdesk.tls.certresolver=letsencrypt
      - traefik.http.services.agentdesk.loadbalancer.server.port=8501
    depends_on:
      - backend
    restart: unless-stopped
