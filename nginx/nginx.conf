# Pick the right "Connection" header: "upgrade" for WebSockets, "close" otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;    # "_" means any domain name. We put the real domain here on the VPS.

    # On the VPS, host nginx sits in front and sends the visitor's IP as X-Real-IP.
    # Trust that header only from the Docker network. Locally the header is absent, so nothing changes.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Real-IP;

    location / {
        # "frontend" is the Compose service name, resolved on the private network.
        proxy_pass http://frontend:8501;
        proxy_http_version 1.1;

        # WebSocket support for Streamlit's live connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Pass visitor details on. Overwrite X-Forwarded-For so visitors cannot fake it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Multi-agent answers can take minutes. The default is 60 seconds.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
